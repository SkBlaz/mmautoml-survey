name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Plot smoke test
        run: |
          uv run python src/plots.py \
            --input tests/data/toy_platforms.csv \
            --outdir outputs-ci \
            --format pdf \
            --no-tex

      - name: Upload smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: plot-smoke-outputs
          path: outputs-ci/
