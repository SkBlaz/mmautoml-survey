[project]
name = "mmautoml-survey"
version = "0.1.0"
description = "Plot generation for multimodal AutoML survey assets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
